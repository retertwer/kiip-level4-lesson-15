<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>KIIP Level 4 · Lesson 15 Quiz</title>
    <style>
        /* ── CSS Variables (Android Theme Sync) ── */
        :root {
            --primary-color: #FFC107;
            --bg-color: #0A0E1A;
            --text-color: #FFFFFF;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-secondary: #94A3B8;
            --correct: #10B981;
            --incorrect: #EF4444;
            --radius: 12px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --transition: 0.25s ease;
            --font-base: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-base);
            min-height: 100vh;
            padding: 16px 12px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background var(--transition), color var(--transition);
            line-height: 1.5;
        }

        .app-container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
        }

        /* ── Header ── */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 12px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .quiz-header .title-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quiz-header .title-group h1 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: var(--text-color);
        }

        .quiz-header .title-group .badge {
            background: var(--primary-color);
            color: #0A0E1A;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }

        .score-display {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--primary-color);
            background: rgba(255, 193, 7, 0.12);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 193, 7, 0.2);
        }

        /* ── Progress ── */
        .progress-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-track .fill {
            height: 100%;
            background: var(--primary-color);
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }

        /* ── Card ── */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--card-border);
            padding: 20px 18px;
            margin-bottom: 18px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: var(--shadow);
            transition: background var(--transition), border var(--transition);
        }

        .card .q-number {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary-color);
            letter-spacing: 0.5px;
            background: rgba(255, 193, 7, 0.10);
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        .card .q-text {
            font-size: 1.05rem;
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 6px;
            word-break: break-word;
        }

        .card .q-translation {
            font-size: 0.9rem;
            color: var(--text-secondary);
            border-left: 3px solid var(--primary-color);
            padding-left: 12px;
            margin-top: 4px;
            margin-bottom: 14px;
            display: none;
        }

        .card .q-translation.show {
            display: block;
        }

        /* ── Options ── */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 4px;
        }

        .option-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            min-height: 52px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius);
            color: var(--text-color);
            font-size: 0.95rem;
            font-weight: 400;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s, border 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
            word-break: break-word;
        }

        .option-btn .letter {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            transition: background 0.2s, color 0.2s;
        }

        .option-btn .opt-translation {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-left: auto;
            padding-left: 8px;
            opacity: 0.7;
            display: none;
        }

        .option-btn .opt-translation.show {
            display: inline;
        }

        .option-btn:active {
            transform: scale(0.97);
        }

        .option-btn:hover:not(.disabled) {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .option-btn.correct {
            border-color: var(--correct) !important;
            background: rgba(16, 185, 129, 0.18) !important;
        }
        .option-btn.correct .letter {
            background: var(--correct);
            color: #fff;
        }

        .option-btn.wrong {
            border-color: var(--incorrect) !important;
            background: rgba(239, 68, 68, 0.18) !important;
        }
        .option-btn.wrong .letter {
            background: var(--incorrect);
            color: #fff;
        }

        .option-btn.disabled {
            cursor: default;
            opacity: 0.7;
        }
        .option-btn.disabled:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.08);
        }
        .option-btn.reveal-correct {
            border-color: var(--correct) !important;
            background: rgba(16, 185, 129, 0.10) !important;
        }

        /* ── Feedback ── */
        .feedback-box {
            margin-top: 14px;
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 0.92rem;
            display: none;
            line-height: 1.5;
            border-left: 4px solid transparent;
        }

        .feedback-box.show {
            display: block;
        }
        .feedback-box.correct {
            background: rgba(16, 185, 129, 0.12);
            border-color: var(--correct);
            color: #6ee7b7;
        }
        .feedback-box.wrong {
            background: rgba(239, 68, 68, 0.12);
            border-color: var(--incorrect);
            color: #fca5a5;
        }

        .feedback-box .fb-trans {
            margin-top: 6px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 6px;
        }

        /* ── Power-ups & Controls ── */
        .powerup-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 16px 0 6px;
        }

        .powerup-bar button {
            flex: 1 1 auto;
            min-height: 44px;
            padding: 6px 14px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-color);
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, border 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .powerup-bar button:active {
            transform: scale(0.96);
        }
        .powerup-bar button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }
        .powerup-bar button:not(:disabled):hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.18);
        }

        .powerup-bar .icon {
            font-size: 1rem;
        }

        /* ── Navigation ── */
        .nav-row {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .nav-row button {
            flex: 1;
            min-height: 52px;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            letter-spacing: 0.3px;
        }

        .nav-row button:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: var(--primary-color);
            color: #0A0E1A;
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .btn-primary:not(:disabled):hover {
            filter: brightness(1.08);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-color);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
        }
        .btn-outline:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.06);
        }

        /* ── Results ── */
        .result-box {
            text-align: center;
            padding: 30px 18px 24px;
        }

        .result-box .score-big {
            font-size: 3.2rem;
            font-weight: 700;
            color: var(--primary-color);
            line-height: 1.2;
        }

        .result-box .score-label {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .result-box .result-msg {
            margin: 16px 0 20px;
            font-size: 1.05rem;
        }

        .result-box .review-toggle {
            margin: 12px 0 8px;
        }

        .review-list {
            margin-top: 18px;
            text-align: left;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 16px;
            max-height: 400px;
            overflow-y: auto;
        }

        .review-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.85rem;
        }

        .review-item .r-icon {
            flex-shrink: 0;
            font-size: 1.1rem;
            margin-top: 1px;
        }
        .review-item .r-text {
            flex: 1;
        }
        .review-item .r-answer {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        /* ── Hidden / Utility ── */
        .hidden {
            display: none !important;
        }

        .mt-4 {
            margin-top: 16px;
        }
        .mt-2 {
            margin-top: 8px;
        }
        .text-center {
            text-align: center;
        }
        .gap-2 {
            gap: 8px;
        }
        .flex-wrap {
            flex-wrap: wrap;
        }
        .items-center {
            align-items: center;
        }

        /* ── Scrollbar ── */
        .review-list::-webkit-scrollbar {
            width: 4px;
        }
        .review-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .review-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            body {
                padding: 10px 8px 30px;
            }
            .card {
                padding: 16px 14px;
            }
            .card .q-text {
                font-size: 0.95rem;
            }
            .option-btn {
                font-size: 0.88rem;
                min-height: 48px;
                padding: 8px 14px;
            }
            .powerup-bar button {
                font-size: 0.7rem;
                min-height: 38px;
                padding: 4px 10px;
                white-space: normal;
            }
            .nav-row button {
                min-height: 48px;
                font-size: 0.9rem;
            }
            .quiz-header .title-group h1 {
                font-size: 0.95rem;
            }
            .result-box .score-big {
                font-size: 2.6rem;
            }
        }

        @media (max-width: 380px) {
            .powerup-bar button {
                font-size: 0.6rem;
                padding: 4px 8px;
            }
            .option-btn {
                font-size: 0.82rem;
                padding: 6px 12px;
                min-height: 44px;
            }
        }

        /* ── Speech button inline ── */
        .speech-trigger {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 8px;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .speech-trigger:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .speech-trigger:active {
            transform: scale(0.92);
        }

        .q-header-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }
        .q-header-row .q-left {
            flex: 1;
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">

        <!-- Header -->
        <header class="quiz-header">
            <div class="title-group">
                <h1>📘 KIIP Lv.4</h1>
                <span class="badge">15과</span>
            </div>
            <div class="score-display" id="scoreDisplay">0 / 30</div>
        </header>

        <!-- Progress -->
        <div class="progress-track">
            <div class="fill" id="progressFill"></div>
        </div>

        <!-- Main Quiz Area -->
        <div id="quizArea">
            <!-- Rendered by JS -->
        </div>

        <!-- Footer / Credit -->
        <div style="text-align:center;margin-top:24px;font-size:0.7rem;color:var(--text-secondary);opacity:0.5;letter-spacing:0.3px;">
            KIIP Level 4 · 법과 질서 · 30문항
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════
        //  QUIZ DATA — Lesson 15: 법과 질서
        //  Vocabulary (p.203) + Grammar (-다시피, -는 법이다)
        //  Reading: 법과 질서 (경범죄, 5대 범죄, 교통 법규)
        //  Culture: 찾기 쉬운 생활 법령 정보 (p.202)
        // ═══════════════════════════════════════════════════

        const QUIZ_DATA = [{
            id: 1,
            type: 'grammar',
            question: '빈칸에 알맞은 것을 고르세요. \n"여러분도 ________, 한국에서는 오른쪽으로 차가 다닙니다."',
            questionTrans: 'ជ្រើសរើសពាក្យដែលត្រឹមត្រូវសម្រាប់ចន្លោះ។ "ដូចដែលអ្នកទាំងអស់គ្នាដឹងហើយ ________ នៅកូរ៉េ រថយន្តបើកបរនៅខាងស្តាំ។"',
            options: ['알다시피', '알더니', '알면서', '알기 위해'],
            optionsTrans: ['ដូចដែលដឹង', 'ហើយបន្ទាប់មកដឹង', 'ខណៈពេលដែលដឹង', 'ដើម្បីដឹង'],
            correct: 0,
            explanation: '「-다시피」는 이미 알고 있는 사실을 언급할 때 사용합니다. (ប្រើ -다시피 ដើម្បីបង្ហាញពីការពិតដែលគេដឹងស្រាប់)',
            explanationTrans: 'ប្រើ -다시피 ដើម្បីបង្ហាញពីការពិតដែលគេដឹងស្រាប់។'
        }, {
            id: 2,
            type: 'vocab',
            question: '"경범죄"의 의미로 알맞은 것은?',
            questionTrans: 'តើអត្ថន័យត្រឹមត្រូវនៃ "បទល្មើសស្រាល" គឺអ្វី?',
            options: ['중대한 범죄', '가벼운 범죄', '국제 범죄', '사이버 범죄'],
            optionsTrans: ['បទល្មើសធ្ងន់ធ្ងរ', 'បទល្មើសស្រាល', 'បទល្មើសអន្តរជាតិ', 'បទល្មើសតាមអ៊ីនធឺណិត'],
            correct: 1,
            explanation: '경범죄는 일상생활에서 흔하게 일어나고 처벌이 가벼운 범죄입니다. (បទល្មើសស្រាលគឺជាបទល្មើសដែលកើតឡើងញឹកញាប់ក្នុងជីវិតប្រចាំថ្ងៃ និងមានទោសស្រាល)',
            explanationTrans: 'បទល្មើសស្រាលគឺជាបទល្មើសដែលកើតឡើងញឹកញាប់ក្នុងជីវិតប្រចាំថ្ងៃ និងមានទោសស្រាល។'
        }, {
            id: 3,
            type: 'grammar',
            question: '빈칸에 알맞은 것을 고르세요. \n"약속 시간은 반드시 ________."',
            questionTrans: 'ជ្រើសរើសពាក្យដែលត្រឹមត្រូវសម្រាប់ចន្លោះ។ "ពេលវេលាណាត់ជួបគឺត្រូវតែ ________ ។"',
            options: ['지키는 척하다', '지키는 법이다', '지키는 정도', '지키는 나머지'],
            optionsTrans: ['ធ្វើដូចជាគោរព', 'ជារឿងដែលត្រូវតែគោរព', 'ដល់កម្រិតដែលគោរព', 'លទ្ធផលនៃការគោរព'],
            correct: 1,
            explanation: '「-는 법이다」는 당연히 그렇게 되는 것임을 나타냅니다. (ប្រើ -는 법이다 ដើម្បីបង្ហាញថាជារឿងដែលត្រូវតែកើតឡើង)',
            explanationTrans: 'ប្រើ -는 법이다 ដើម្បីបង្ហាញថាជារឿងដែលត្រូវតែកើតឡើង។'
        }, {
            id: 4,
            type: 'vocab',
            question: '"명예훼손죄"의 의미로 알맞은 것은?',
            questionTrans: 'តើអត្ថន័យត្រឹមត្រូវនៃ "បទល្មើសបំផ្លាញកិត្តិយស" គឺអ្វី?',
            options: ['다른 사람을 때리는 죄', '다른 사람의 명예를 훼손하는 죄', '돈을 훔치는 죄', '건물에 불을 지르는 죄'],

        }, {

            questionTrans: 'តើព័ត៌មានអ្វីខ្លះដែលអាចរកឃើញនៅក្នុងព័ត៌មានច្បាប់ប្រចាំថ្ងៃដែលអាចរកបានយ៉ាងងាយស្រួល?',
            options: ['교통법규만', '민사법만', '생활 속 다양한 법령', '형사법만'],
            optionsTrans: ['មានតែច្បាប់ចរាចរណ៍', 'មានតែច្បាប់រដ្ឋប្បវេណី', 'ច្បាប់ផ្សេងៗក្នុងជីវិតប្រចាំថ្ងៃ', 'មានតែច្បាប់ព្រហ្មទណ្ឌ'],
            correct: 2,
            explanation: '교통, 민사, 형사 등 생활 속 다양한 법령 정보를 제공합니다. (ផ្តល់ព័ត៌មានច្បាប់ផ្សេងៗក្នុងជីវិតប្រចាំថ្ងៃ ដូចជា ចរាចរណ៍ រដ្ឋប្បវេណី និងព្រហ្មទណ្ឌ)',
            explanationTrans: 'ផ្តល់ព័ត៌មានច្បាប់ផ្សេងៗក្នុងជីវិតប្រចាំថ្ងៃ ដូចជា ចរាចរណ៍ រដ្ឋប្បវេណី និងព្រហ្មទណ្ឌ។'

            question: '생활 법령 정보를 잘 알면 어떤 점이 좋습니까?',

            options: ['불이익을 피할 수 있다', '세금을 줄일 수 있다', '취업이 쉽다', '여행이 쉽다'],
            optionsTrans: ['អាចជៀសវាងគ្រោះថ្នាក់/ការខូចខាត', 'អាចកាត់បន្ថយពន្ធ', 'ងាយស្រួលរកការងារ', 'ងាយស្រួលធ្វើដំណើរ'],
            correct: 0,
            explanation: '법을 알면 불이익을 피하고 자신을 보호할 수 있습니다. (ការដឹងច្បាប់អាចជួយជៀសវាងគ្រោះថ្នាក់ និងការពារខ្លួន)',
            explanationTrans: 'ការដឹងច្បាប់អាចជួយជៀសវាងគ្រោះថ្នាក់ និងការពារខ្លួន។'

        // ═══════════════════════════════════════════════════
        //  QUIZ ENGINE (same structure as Lesson 2)
        // ═══════════════════════════════════════════════════

        (function() {
            'use strict';

            const app = document.getElementById('app');
            const quizArea = document.getElementById('quizArea');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const progressFill = document.getElementById('progressFill');

            let currentIndex = 0;
            let score = 0;
            let answered = false;
            let powerups = { translateQ: false, fifty: false, translateA: false };
            let selectedOption = null;
            let questions = QUIZ_DATA;
            let userAnswers = [];

            // ── TTS via Android bridge or fallback ──
            function speakText(text, lang = 'ko') {
                if (typeof Android !== 'undefined' && typeof Android.speak === 'function') {
                    try {
                        Android.speak(text, lang);
                        return;
                    } catch (_) { /* fall through */ }
                }
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = lang;
                    utterance.rate = 0.9;
                    utterance.pitch = 1;
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.speak(utterance);
                } else {
                    console.warn('TTS not available');
                }
            }

            // ── Render ──
            function render() {
                if (currentIndex >= questions.length) {
                    renderResults();
                    return;
                }

                const q = questions[currentIndex];
                const total = questions.length;
                const progress = ((currentIndex) / total) * 100;
                progressFill.style.width = progress + '%';
                scoreDisplay.textContent = score + ' / ' + total;

                answered = false;
                selectedOption = null;
                powerups = { translateQ: false, fifty: false, translateA: false };

                let html = `
                    <div class="card" id="card-${q.id}">
                        <div class="q-number">${currentIndex+1} / ${total} · ${q.type === 'vocab' ? '어휘' : q.type === 'grammar' ? '문법' : q.type === 'reading' ? '읽기' : '문화'}</div>
                        <div class="q-header-row">
                            <div class="q-left">
                                <div class="q-text">${q.question.replace(/\n/g, '<br>')}</div>
                                <div class="q-translation" id="qTrans">${q.questionTrans}</div>
                            </div>
                            <button class="speech-trigger" data-speak="${q.question.replace(/"/g, '&quot;')}" data-lang="ko" aria-label="Listen Korean">
                                🔊
                            </button>
                        </div>

                        <div class="options-grid" id="optionsGrid">
                `;

                const letters = ['①', '②', '③', '④'];
                const optionStates = [false, false, false, false];

                if (powerups.fifty) {
                    const wrongIndices = [];
                    for (let i = 0; i < q.options.length; i++) {
                        if (i !== q.correct) wrongIndices.push(i);
                    }
                    for (let i = wrongIndices.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [wrongIndices[i], wrongIndices[j]] = [wrongIndices[j], wrongIndices[i]];
                    }
                    const hideThese = wrongIndices.slice(0, 2);
                    hideThese.forEach(idx => { optionStates[idx] = true; });
                }

                for (let i = 0; i < q.options.length; i++) {
                    const hidden = optionStates[i] ? ' hidden' : '';
                    html += `
                        <button class="option-btn${hidden}" data-optindex="${i}" id="opt-${i}">
                            <span class="letter">${letters[i]}</span>
                            <span>${q.options[i]}</span>
                            <span class="opt-translation">${q.optionsTrans[i]}</span>
                        </button>
                    `;
                }

                html += `
                        </div>

                        <div class="feedback-box" id="feedbackBox"></div>

                        <div class="powerup-bar">
                            <button id="puTranslateQ" class="pu-btn" data-pu="translateQ">
                                <span class="icon">🌐</span> 번역
                            </button>
                            <button id="puFifty" class="pu-btn" data-pu="fifty">
                                <span class="icon">✂️</span> 50/50
                            </button>
                            <button id="puTranslateA" class="pu-btn" data-pu="translateA">
                                <span class="icon">📖</span> 답변 번역
                            </button>
                            <button class="speech-trigger" data-speak="${q.questionTrans.replace(/"/g, '&quot;')}" data-lang="km" aria-label="Listen Khmer">
                                🔊🇰🇭
                            </button>
                        </div>

                        <div class="nav-row">
                            <button class="btn-outline" id="prevBtn" ${currentIndex === 0 ? 'disabled' : ''}>◀ 이전</button>
                            <button class="btn-primary" id="checkBtn" disabled>정답 확인</button>
                            <button class="btn-primary" id="nextBtn">다음 ▶</button>
                        </div>
                    </div>
                `;

                quizArea.innerHTML = html;

                document.querySelectorAll('.option-btn:not(.hidden)').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        if (answered) return;
                        const idx = parseInt(this.dataset.optindex);
                        selectOption(idx);
                    });
                    btn.addEventListener('touchstart', function() {
                        if (!answered) this.style.transform = 'scale(0.97)';
                    }, { passive: true });
                    btn.addEventListener('touchend', function() {
                        this.style.transform = '';
                    }, { passive: true });
                });

                document.getElementById('checkBtn').addEventListener('click', checkAnswer);
                document.getElementById('nextBtn').addEventListener('click', nextQuestion);

                const prevBtn = document.getElementById('prevBtn');
                if (prevBtn) {
                    prevBtn.addEventListener('click', function() {
                        if (currentIndex > 0) {
                            currentIndex--;
                            render();
                        }
                    });
                }

                document.querySelectorAll('.pu-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const type = this.dataset.pu;
                        applyPowerup(type);
                    });
                });

                document.querySelectorAll('.speech-trigger').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const text = this.dataset.speak;
                        const lang = this.dataset.lang || 'ko';
                        if (text) speakText(text, lang);
                    });
                });

                updateCheckButton();

                if (powerups.fifty) {
                    // already handled in rendering
                }
            }

            function selectOption(idx) {
                if (answered) return;
                document.querySelectorAll('.option-btn').forEach(b => {
                    b.classList.remove('correct', 'wrong');
                    b.style.borderColor = '';
                });
                const btn = document.getElementById('opt-' + idx);
                if (btn && !btn.classList.contains('hidden')) {
                    btn.style.borderColor = 'var(--primary-color)';
                    selectedOption = idx;
                    updateCheckButton();
                }
            }

            function updateCheckButton() {
                const btn = document.getElementById('checkBtn');
                if (btn) {
                    btn.disabled = (selectedOption === null || answered);
                }
            }

            function checkAnswer() {
                if (answered || selectedOption === null) return;
                const q = questions[currentIndex];
                const isCorrect = (selectedOption === q.correct);
                if (isCorrect) score++;

                answered = true;
                const fb = document.getElementById('feedbackBox');
                const optBtns = document.querySelectorAll('.option-btn:not(.hidden)');

                optBtns.forEach((btn, idx) => {
                    const realIdx = parseInt(btn.dataset.optindex);
                    btn.classList.add('disabled');
                    if (realIdx === q.correct) {
                        btn.classList.add('correct');
                    } else if (realIdx === selectedOption && !isCorrect) {
                        btn.classList.add('wrong');
                    }
                    if (!isCorrect && realIdx === q.correct) {
                        btn.classList.add('reveal-correct');
                    }
                    btn.style.borderColor = '';
                });

                fb.className = 'feedback-box show ' + (isCorrect ? 'correct' : 'wrong');
                fb.innerHTML = `
                    <strong>${isCorrect ? '✅ 정답입니다!' : '❌ 오답입니다.'}</strong>
                    <div style="margin-top:4px;">${q.explanation}</div>
                    <div class="fb-trans">${q.explanationTrans}</div>
                `;

                userAnswers[currentIndex] = { selected: selectedOption, correct: isCorrect };

                document.getElementById('checkBtn').disabled = true;
                scoreDisplay.textContent = score + ' / ' + questions.length;
            }

            function nextQuestion() {
                if (currentIndex < questions.length - 1) {
                    currentIndex++;
                    render();
                } else {
                    renderResults();
                }
            }

            function applyPowerup(type) {
                if (answered) return;
                if (type === 'translateQ') {
                    powerups.translateQ = !powerups.translateQ;
                    const el = document.getElementById('qTrans');
                    if (el) el.classList.toggle('show');
                    const btn = document.querySelector('[data-pu="translateQ"]');
                    if (btn) btn.style.borderColor = powerups.translateQ ? 'var(--primary-color)' : '';
                } else if (type === 'fifty') {
                    if (powerups.fifty) return;
                    powerups.fifty = true;
                    render();
                } else if (type === 'translateA') {
                    powerups.translateA = !powerups.translateA;
                    document.querySelectorAll('.opt-translation').forEach(el => {
                        el.classList.toggle('show');
                    });
                    const btn = document.querySelector('[data-pu="translateA"]');
                    if (btn) btn.style.borderColor = powerups.translateA ? 'var(--primary-color)' : '';
                }
            }

            // ── Results ──
            function renderResults() {
                const total = questions.length;
                const pct = Math.round((score / total) * 100);
                progressFill.style.width = '100%';

                let grade = '';
                let emoji = '';
                if (pct >= 90) { grade = '우수 (Excellent)';
                    emoji = '🌟'; } else if (pct >= 70) { grade = '양호 (Good)';
                    emoji = '👍'; } else if (pct >= 50) { grade = '보통 (Average)';
                    emoji = '📖'; } else { grade = '복습 필요 (Needs Review)';
                    emoji = '🔄'; }

                let html = `
                    <div class="card result-box">
                        <div class="score-big">${score} / ${total}</div>
                        <div class="score-label">${pct}% · ${grade} ${emoji}</div>
                        <div class="result-msg">
                            ${pct >= 70 ? '🎉 잘하셨습니다! 계속 화이팅!' : '💪 더 열심히 공부해 봅시다!'}
                        </div>
                        <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px;">
                            <button class="btn-primary" id="retryBtn" style="flex:1;min-height:48px;">🔄 다시 풀기</button>
                            <button class="btn-outline" id="reviewToggleBtn" style="flex:1;min-height:48px;">📋 오답 노트</button>
                        </div>
                        <div class="review-list hidden" id="reviewList"></div>
                    </div>
                `;

                quizArea.innerHTML = html;
                scoreDisplay.textContent = score + ' / ' + total;

                document.getElementById('retryBtn').addEventListener('click', function() {
                    resetQuiz();
                });

                document.getElementById('reviewToggleBtn').addEventListener('click', function() {
                    const list = document.getElementById('reviewList');
                    if (list.classList.contains('hidden')) {
                        list.classList.remove('hidden');
                        buildReviewList(list);
                        this.textContent = '📋 닫기';
                    } else {
                        list.classList.add('hidden');
                        this.textContent = '📋 오답 노트';
                    }
                });
            }

            function buildReviewList(container) {
                container.innerHTML = '';
                const total = questions.length;
                for (let i = 0; i < total; i++) {
                    const q = questions[i];
                    const ua = userAnswers[i] || { selected: -1, correct: false };
                    const isCorrect = ua.correct;
                    const icon = isCorrect ? '✅' : '❌';
                    const answerText = q.options[ua.selected] || '(미응답)';
                    const correctText = q.options[q.correct];
                    const item = document.createElement('div');
                    item.className = 'review-item';
                    item.innerHTML = `
                        <span class="r-icon">${icon}</span>
                        <span class="r-text">
                            <strong>${i+1}.</strong> ${q.question.replace(/\n/g, ' ').substring(0, 60)}${q.question.length > 60 ? '…' : ''}
                            <div class="r-answer">내 답: ${answerText} ${!isCorrect ? ' (정답: ' + correctText + ')' : ''}</div>
                        </span>
                    `;
                    container.appendChild(item);
                }
            }

            function resetQuiz() {
                currentIndex = 0;
                score = 0;
                answered = false;
                userAnswers = [];
                powerups = { translateQ: false, fifty: false, translateA: false };
                selectedOption = null;
                render();
            }

            render();

            window.__quiz = { speakText, resetQuiz, render };

        })();
    </script>
